experiment:
  name: LV2
  description: "LV2: large discrete LV publication experiment with symmetric log-normal competition and compact summaries only."
  random_seed: 1234

model:
  type: lv_discrete

community:
  richness: 4
  replicates: 3

traits:
  birth_maximum:
    mean: 0.3
    range: 0
    distribution: random_uniform
  birth_optimum:
    mean: 16
    range: 0
    distribution: random_uniform
  birth_width:
    mean: 6
    range: 4
    distribution: random_uniform
  death:
    intercept: 0
    temperature_slope: 0.05

interactions:
  treatments:
    - label: competition_mean_0
      type: competition
      symmetry: symmetric
      distribution: constant
      parameters:
        value: 0
      diagonal: 1
    - label: lognormal_competition_median_0.25
      type: competition
      symmetry: symmetric
      distribution: lognormal
      parameters:
        meanlog: -1.3863
        sdlog: 0.5
      diagonal: 1
    - label: lognormal_competition_median_0.5
      type: competition
      symmetry: symmetric
      distribution: lognormal
      parameters:
        meanlog: -0.6931
        sdlog: 0.5
      diagonal: 1
    - label: lognormal_competition_median_0.75
      type: competition
      symmetry: symmetric
      distribution: lognormal
      parameters:
        meanlog: -0.2877
        sdlog: 0.5
      diagonal: 1
    - label: lognormal_competition_median_1
      type: competition
      symmetry: symmetric
      distribution: lognormal
      parameters:
        meanlog: 0
        sdlog: 0.5
      diagonal: 1

environment:
  replicates: 3
  sharing: same_per_replicate
  temperature:
    mean: 20
    sd: 4
    one_over_f_gamma: 0.8

simulation:
  burn_in_duration: 1000
  experiment_duration: 1000
  immigration_rate: 0.1
  initial_abundance_seed_base: 4242

output:
  save_dynamics: false
  save_resources: false
  dynamics_save_every: 1
  resources_save_every: 1
  summary_checkpoint_every: 10
  runtime_update_every: 100
  simulation_progress: true
  environment_progress: true

parallel:
  workers: available_cores_minus_1
  environments: true
  simulations: true
  community_measures: true

treatments:
  values:
    community.richness: [4, 8, 12]
    traits.birth_optimum.mean: [16, 20, 24]
    traits.birth_optimum.range: [0, 2, 4]
    traits.birth_width.mean: [6, 10, 14]
    traits.birth_width.range: [4, 10]
